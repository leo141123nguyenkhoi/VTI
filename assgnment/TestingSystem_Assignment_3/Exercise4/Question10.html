<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num1 = Number(prompt("Nhập số đầu tiên"));
        const num2 = Number(prompt("Nhập số thứ 2"));
        const tong = num1 + num2 ;
        const hieu = num1- num2 ;
        document.write("Số thứ nhất: " + num1 +"<br>");
        document.write("Số thứ 2: " + num2 + "<br>")
        document.write("Tổng: " + tong + "<br>");
        document.write("Hiệu: " + hieu + "<br>");
        if (num2 !== 0) {
            const chia = num1/num2;
            const chiadu = num1%num2;
            document.write("Chia: " + chia + "<br>");
            document.write("Chia Lấy Dư: " + chiadu + "<br>")
        } else {
            document.write("Không thể chia được " + "<br>");
        }
    </script>
    
</body>
</html>
